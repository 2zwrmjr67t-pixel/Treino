<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141311">
<title>Execução 3D</title>
<style>
:root{--bg:#141311;--s1:rgba(22,21,19,.86);--br:#2e2c29;--tx:#e8e2d8;--mt:#8a847a;--ac:#c9a05a;--gn:#7fb27f;--rd:#c98080}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:18px;right:18px;top:max(16px,env(safe-area-inset-top));pointer-events:none;display:flex;justify-content:space-between;gap:10px}
.eyebrow{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--mt);margin:0 0 5px}
h1{font-family:Georgia,'Iowan Old Style',serif;font-weight:500;font-size:21px;line-height:1.15;margin:0}
.sub{font-size:11px;color:var(--mt);margin-top:4px}
.legend{font-size:10px;color:var(--mt);margin-top:9px;display:flex;gap:12px;flex-wrap:wrap}
.alt{display:none;gap:6px;margin-top:9px;pointer-events:auto}
.alt a{font-size:10.5px;color:var(--tx);text-decoration:none;border:1px solid var(--br);background:var(--s1);padding:4px 9px;border-radius:7px}
.alt a.on{border-color:var(--ac);color:var(--ac)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
#back{pointer-events:auto;display:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--br);background:var(--s1);color:var(--tx);font-size:15px;flex:none}
.views{display:flex;gap:5px;align-items:center;margin:0 0 11px;padding-bottom:10px;border-bottom:1px solid var(--br)}
.vl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mt);margin-right:4px}
.views button,.ctl button{font-family:inherit;background:var(--s1);border:1px solid var(--br);color:var(--tx);font-size:10.5px;padding:6px 9px;border-radius:8px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.views button.on,.ctl button.on{border-color:var(--ac);color:var(--ac)}
#tag{position:fixed;left:0;top:0;pointer-events:none;transition:opacity .2s;will-change:transform}
#tag span{position:absolute;left:14px;top:-34px;white-space:nowrap;font-size:10.5px;color:var(--ac);background:rgba(20,19,17,.82);border:1px solid rgba(201,160,90,.45);padding:3px 8px;border-radius:7px}
#tag:before{content:"";position:absolute;left:0;top:-20px;width:14px;height:20px;border-left:1px solid rgba(201,160,90,.6);border-top:1px solid rgba(201,160,90,.6);transform:skewX(-35deg);transform-origin:bottom left}
#tag:after{content:"";position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.panel{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:var(--s1);border:1px solid var(--br);border-radius:14px;padding:12px 13px 11px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:560px;margin:0 auto}
#phases{display:flex;gap:5px}
.ph{flex:1 1 0;min-width:0;background:none;border:none;padding:0;text-align:left;color:var(--mt);font-family:inherit;cursor:pointer}
.ph-n{display:block;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.ph.on .ph-n{color:var(--tx)}
.ph-bar{display:block;height:3px;background:#2e2c29;border-radius:2px;overflow:hidden}
.ph-bar i{display:block;height:100%;width:0;background:var(--ac)}
#cap{font-size:12.5px;line-height:1.5;margin:10px 0 9px;min-height:38px}
.row{display:flex;align-items:center;gap:8px}
.cues{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.cue{font-size:9.5px;padding:3px 7px;border-radius:7px;border:1px solid var(--br);color:var(--mt);transition:all .25s}
.cue.ok{color:var(--gn);border-color:rgba(127,178,127,.35)}
.cue.hot{color:var(--ac);border-color:rgba(201,160,90,.6);background:rgba(201,160,90,.08)}
.cue.warn.hot{color:var(--rd);border-color:rgba(201,128,128,.6);background:rgba(201,128,128,.08)}
.meter{display:flex;align-items:center;gap:7px;font-size:9.5px;color:var(--mt);margin-top:9px}
.meter .mb{flex:1;height:4px;background:#2e2c29;border-radius:2px;overflow:hidden}
.meter .mb b{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6c3a,var(--ac))}
.ctl{display:flex;gap:6px}
#play{min-width:38px}
.ft{font-size:9px;color:var(--mt);margin-top:8px;line-height:1.4}
.hint{position:fixed;left:0;right:0;text-align:center;font-size:10px;color:var(--mt);bottom:250px;pointer-events:none;transition:opacity .4s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <div>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
    <div class="legend" id="legend"></div>
    <div class="alt" id="alt"></div>
  </div>
  <button id="back" aria-label="Voltar">←</button>
</div>
<div id="tag"><span>trapézio superior</span></div>
<div class="hint">arraste para girar · pinça para zoom</div>
<div class="panel">
  <div class="views"><span class="vl">vista</span><button data-v="tq" class="on">3/4</button><button data-v="pos">Trás</button><button data-v="lat">Lado</button><button data-v="fr">Frente</button></div>
  <div id="phases"></div>
  <div id="cap"></div>
  <div class="row">
    <div class="cues" id="cues"></div>
    <div class="ctl"><button id="slow">1×</button><button id="play">❚❚</button></div>
  </div>
  <div class="meter">contração<span class="mb"><b id="meter"></b></span><span id="pct">0%</span></div>
  <div class="ft">Esquema ilustrativo do padrão de movimento: não substitui a orientação de um profissional.</div>
</div>
<script type="module" src="./demo3d.js"></script>
</body>
</html>
